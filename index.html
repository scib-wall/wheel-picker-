<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wheel Picker Pro</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>

  <div class="geo-bg">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
    <div class="shape shape-4"></div>
  </div>

  <header class="navbar">
    <div class="logo"><i class="fa-solid fa-dharmachakra"></i> WheelPicker <span>PRO</span></div>
    <div class="nav-controls">
      <button id="reset-btn" class="btn-secondary"><i class="fa-solid fa-rotate-right"></i> Reset</button>
    </div>
  </header>

  <main class="app-container">
    
    <section class="wheel-section">
      <div class="wheel-wrapper">
        <div class="pointer"></div>
        <canvas id="wheel" width="480" height="480"></canvas>
        <button id="spin-center-btn">SPIN</button>
      </div>
    </section>

    <aside class="sidebar">
      <div class="panel-header">
        <h3><i class="fa-solid fa-users"></i> Entries (<span id="entry-count">6</span>)</h3>
      </div>
      
      <div class="input-group">
        <input type="text" id="name-input" placeholder="Type a name and hit Enter..." />
        <button id="add-btn" class="btn-primary"><i class="fa-solid fa-plus"></i> Add</button>
      </div>

      <div class="entries-list" id="entries-list">
        </div>
    </aside>

  </main>

  <div id="result-modal" class="modal hidden">
    <div class="modal-card">
      <div class="confetti-icon">🎉</div>
      <h2>WE HAVE A WINNER!</h2>
      <p id="winner-name">NAME</p>
      <button id="close-btn" class="btn-primary">Continue</button>
    </div>
  </div>

  <audio id="tick-sound" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3" preload="auto"></audio>
  <audio id="win-sound" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3" preload="auto"></audio>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
